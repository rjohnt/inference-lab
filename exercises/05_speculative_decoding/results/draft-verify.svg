<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img"><title>speculative decoding</title><desc>draft → verify → accept or correct</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#34d399"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e4ede9}.muted{fill:#94aaa1;font-size:14px}.heading{font-size:18px;font-weight:600}.arrow{fill:none;stroke:#34d399;stroke-width:2;marker-end:url(#arrow)}</style><rect width="640" height="540" rx="16" fill="#101b16"/><text x="30" y="44" font-size="25" font-weight="600">speculative decoding</text><text x="30" y="73" class="muted">draft → verify → accept or correct</text><rect x="30" y="105" width="580" height="95" rx="9" fill="#15261f" stroke="#34d399"/><text x="46" y="134" class="heading">1 · draft a block</text><text x="46" y="159" class="muted">a smaller draft model proposes candidate tokens</text><rect x="65" y="217" width="108" height="42" rx="7" fill="#15261f" stroke="#34d399"/><text x="119" y="243" font-size="16" text-anchor="middle">the</text><rect x="192" y="217" width="108" height="42" rx="7" fill="#15261f" stroke="#34d399"/><text x="246" y="243" font-size="16" text-anchor="middle">robot</text><rect x="319" y="217" width="108" height="42" rx="7" fill="#15261f" stroke="#34d399"/><text x="373" y="243" font-size="16" text-anchor="middle">moves</text><rect x="446" y="217" width="108" height="42" rx="7" fill="#15261f" stroke="#fb7185"/><text x="500" y="243" font-size="16" text-anchor="middle">fast</text><path class="arrow" d="M320 200V212"/><path class="arrow" d="M320 259V285"/><rect x="30" y="295" width="580" height="83" rx="9" fill="#15261f" stroke="#34d399"/><text x="46" y="324" class="heading">2 · verify with the main model</text><text x="46" y="349" class="muted">check candidate tokens together</text><path class="arrow" d="M320 378V405"/><rect x="30" y="415" width="580" height="63" rx="9" fill="#15261f" stroke="#34d399"/><text x="46" y="444" class="heading">3 · keep accepted tokens; correct and continue</text><text x="46" y="469" class="muted"></text><text x="30" y="505" class="muted">Illustrative tokens. Speed depends on acceptance and verification cost.</text></svg>