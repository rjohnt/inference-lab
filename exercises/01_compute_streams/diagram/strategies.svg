<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610"><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
<style>text{font-family:'SF Mono',monospace;fill:#e2e8f0}</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="30" y="35" font-size="20" text-anchor="start">Same four requests. Three ways to schedule the work.</text>
<text x="30" y="63" font-size="12" text-anchor="start">Shared weight W • GPU-resident inputs • same outputs • conceptual, not measured timing</text>
<rect x="40" y="100" width="260" height="380" rx="6" fill="#94a3b8" fill-opacity=".15" stroke="#94a3b8"/>
<text x="170" y="130" font-size="17" text-anchor="middle">Sequential</text>
<rect x="350" y="100" width="260" height="380" rx="6" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
<text x="480" y="130" font-size="17" text-anchor="middle">Multiple streams</text>
<rect x="660" y="100" width="260" height="380" rx="6" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/>
<text x="790" y="130" font-size="17" text-anchor="middle">Batched</text>
<rect x="80" y="155" width="180" height="45" rx="6" fill="#94a3b8" fill-opacity=".15" stroke="#94a3b8"/>
<text x="170" y="183" font-size="13" text-anchor="middle">X0 @ W</text>
<path d="M170 200V219" stroke="#94a3b8" marker-end="url(#arrow)"/>
<rect x="80" y="223" width="180" height="45" rx="6" fill="#94a3b8" fill-opacity=".15" stroke="#94a3b8"/>
<text x="170" y="251" font-size="13" text-anchor="middle">X1 @ W</text>
<path d="M170 268V287" stroke="#94a3b8" marker-end="url(#arrow)"/>
<rect x="80" y="291" width="180" height="45" rx="6" fill="#94a3b8" fill-opacity=".15" stroke="#94a3b8"/>
<text x="170" y="319" font-size="13" text-anchor="middle">X2 @ W</text>
<path d="M170 336V355" stroke="#94a3b8" marker-end="url(#arrow)"/>
<rect x="80" y="359" width="180" height="45" rx="6" fill="#94a3b8" fill-opacity=".15" stroke="#94a3b8"/>
<text x="170" y="387" font-size="13" text-anchor="middle">X3 @ W</text>
<text x="170" y="457" font-size="11" text-anchor="middle">One stream; ordered kernels</text>
<rect x="370" y="166" width="220" height="44" rx="6" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
<text x="480" y="193" font-size="12" text-anchor="middle">Stream 0: X0 @ W</text>
<rect x="370" y="229" width="220" height="44" rx="6" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
<text x="480" y="256" font-size="12" text-anchor="middle">Stream 1: X1 @ W</text>
<rect x="370" y="292" width="220" height="44" rx="6" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
<text x="480" y="319" font-size="12" text-anchor="middle">Stream 2: X2 @ W</text>
<rect x="370" y="355" width="220" height="44" rx="6" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
<text x="480" y="382" font-size="12" text-anchor="middle">Stream 3: X3 @ W</text>
<text x="480" y="457" font-size="11" text-anchor="middle">Independent branches; fork/join</text>
<rect x="680" y="195" width="220" height="175" rx="6" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/>
<text x="790" y="232" font-size="15" text-anchor="middle">[X0; X1; X2; X3]</text>
<text x="790" y="274" font-size="20" text-anchor="middle">@ W</text>
<text x="790" y="317" font-size="13" text-anchor="middle">One larger GEMM</text>
<text x="790" y="347" font-size="10" text-anchor="middle">No packing in this test</text>
<text x="790" y="457" font-size="11" text-anchor="middle">Larger work unit; fewer launches</text>
<text x="40" y="522" font-size="12" text-anchor="start">Streams permit concurrency; the GPU scheduler and available resources determine overlap.</text>
<text x="40" y="547" font-size="12" text-anchor="start">Batching is natural for same-model requests, but a real server also pays queueing delay.</text>
<text x="40" y="572" font-size="12" text-anchor="start">Measure ordinary calls and CUDA Graph replay; verify actual overlap in a separate trace.</text>
</svg>
