<text x="925.0" y="463" font-size="10" fill="#94a3b8" text-anchor="middle">Full Qwen3-8B model</text>
<text x="680" y="390" font-size="11" fill="#94a3b8" text-anchor="middle">1. Prompt</text>
<text x="930" y="390" font-size="11" fill="#94a3b8" text-anchor="middle">2. Prompt + metadata</text>
<text x="802" y="505" font-size="13" fill="#a78bfa" text-anchor="middle">NIXL / UCX pulls GPU KV cache</text>
<text x="802" y="530" font-size="12" fill="#94a3b8" text-anchor="middle">Peer topology: NV12</text>
<text x="277" y="525" font-size="13" fill="#94a3b8" text-anchor="middle">No inter-worker KV transfer</text>
<text x="277" y="550" font-size="12" fill="#94a3b8" text-anchor="middle">Each GPU holds the full model</text>
<text x="30" y="624" font-size="13" fill="#e2e8f0" text-anchor="start">Validation: greedy output comparison + required transfer metadata + NIXL counters</text>
<text x="30" y="650" font-size="13" fill="#94a3b8" text-anchor="start">Timing: client TTFT, time/output token, chunk gaps, aggregate output tokens/s</text>
<text x="30" y="676" font-size="11" fill="#94a3b8" text-anchor="start">PyTorch peer-copy bandwidth is a separate control; it is not NIXL transfer bandwidth.</text>
