version = 1

[*]
ctx-size = 16384
parallel = 1
n-gpu-layers = all
fit = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 128
jinja = true
reasoning-format = deepseek
metrics = true
cache-ram = 0
load-mode = dio
sleep-idle-seconds = 120
load-on-startup = false

[nemotron-nano-9b-v2]
model = /path/to/data/gpustation-models/nemotron/nvidia_NVIDIA-Nemotron-Nano-9B-v2-Q4_K_M.gguf
temp = 0.6
top-p = 0.95

[qwen3.8-27b-dflash2]
model = /path/to/data/gpustation-benchmarks/dflash2/models/Qwen3.8-27B-UD-IQ2_S.gguf
reasoning = off
spec-type = draft-dflash
model-draft = /path/to/data/gpustation-benchmarks/dflash2/models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
spec-draft-ngl = all
spec-draft-n-max = 7
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
