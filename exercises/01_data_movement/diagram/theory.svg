<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710"><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
<style>text{font-family:'SF Mono','Cascadia Code',monospace;fill:#e2e8f0} .sub{fill:#94a3b8}</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="30" y="35" font-size="22" text-anchor="start">Keeping the GPU fed</text>
<text x="30" y="59" font-size="12" text-anchor="start" style="fill:#94a3b8">Conceptual model — bar lengths are illustrative, not benchmark measurements</text>
<path d="M260 143H390" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="325.0" y="124" font-size="11" text-anchor="middle">H2D upload</text>
<path d="M610 143H740" stroke="#94a3b8" marker-end="url(#arrow)"/>
<text x="675.0" y="124" font-size="11" text-anchor="middle">D2H download</text>
<rect x="40" y="110" width="220" height="70" rx="8" fill="#0f172a"/>
<rect x="40" y="110" width="220" height="70" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee"/>
<text x="150.0" y="137" font-size="13" text-anchor="middle">CPU input buffers</text>
<text x="150.0" y="157" font-size="10" text-anchor="middle" style="fill:#94a3b8">Pinned: reusable DMA source</text>
<rect x="390" y="110" width="220" height="70" rx="8" fill="#0f172a"/>
<rect x="390" y="110" width="220" height="70" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399"/>
<text x="500.0" y="137" font-size="13" text-anchor="middle">GPU memory + compute</text>
<text x="500.0" y="157" font-size="10" text-anchor="middle" style="fill:#94a3b8">Weights remain on the GPU</text>
<rect x="740" y="110" width="220" height="70" rx="8" fill="#0f172a"/>
<rect x="740" y="110" width="220" height="70" rx="8" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa"/>
<text x="850.0" y="137" font-size="13" text-anchor="middle">CPU output buffers</text>
<text x="850.0" y="157" font-size="10" text-anchor="middle" style="fill:#94a3b8">Read after transfer completion</text>
<text x="40" y="219" font-size="15" text-anchor="start">Serial: finish one batch before starting the next</text>
<rect x="180" y="240" width="96" height="36" rx="4" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee"/>
<text x="228" y="262" font-size="11" text-anchor="middle">Upload 0</text>
<rect x="280" y="240" width="96" height="36" rx="4" fill="#34d399" fill-opacity=".25" stroke="#34d399"/>
<text x="328" y="262" font-size="11" text-anchor="middle">Compute 0</text>
<rect x="380" y="240" width="96" height="36" rx="4" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/>
<text x="428" y="262" font-size="11" text-anchor="middle">Download 0</text>
<rect x="510" y="240" width="96" height="36" rx="4" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee"/>
<text x="558" y="262" font-size="11" text-anchor="middle">Upload 1</text>
<rect x="610" y="240" width="96" height="36" rx="4" fill="#34d399" fill-opacity=".25" stroke="#34d399"/>
<text x="658" y="262" font-size="11" text-anchor="middle">Compute 1</text>
<rect x="710" y="240" width="96" height="36" rx="4" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/>
<text x="758" y="262" font-size="11" text-anchor="middle">Download 1</text>
<text x="40" y="319" font-size="15" text-anchor="start">Pipelined: different batches use different stages concurrently</text>
<text x="45" y="363" font-size="12" text-anchor="start">Upload</text>
<rect x="180" y="340" width="96" height="34" rx="4" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee"/>
<text x="228" y="362" font-size="11" text-anchor="middle">Batch 0</text>
<rect x="280" y="340" width="96" height="34" rx="4" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee"/>
<text x="328" y="362" font-size="11" text-anchor="middle">Batch 1</text>
<rect x="380" y="340" width="96" height="34" rx="4" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee"/>
<text x="428" y="362" font-size="11" text-anchor="middle">Batch 2</text>
<rect x="480" y="340" width="96" height="34" rx="4" fill="#22d3ee" fill-opacity=".25" stroke="#22d3ee"/>
<text x="528" y="362" font-size="11" text-anchor="middle">Batch 3</text>
<text x="45" y="413" font-size="12" text-anchor="start">Compute</text>
<rect x="280" y="390" width="96" height="34" rx="4" fill="#34d399" fill-opacity=".25" stroke="#34d399"/>
<text x="328" y="412" font-size="11" text-anchor="middle">Batch 0</text>
<rect x="380" y="390" width="96" height="34" rx="4" fill="#34d399" fill-opacity=".25" stroke="#34d399"/>
<text x="428" y="412" font-size="11" text-anchor="middle">Batch 1</text>
<rect x="480" y="390" width="96" height="34" rx="4" fill="#34d399" fill-opacity=".25" stroke="#34d399"/>
<text x="528" y="412" font-size="11" text-anchor="middle">Batch 2</text>
<rect x="580" y="390" width="96" height="34" rx="4" fill="#34d399" fill-opacity=".25" stroke="#34d399"/>
<text x="628" y="412" font-size="11" text-anchor="middle">Batch 3</text>
<text x="45" y="463" font-size="12" text-anchor="start">Download</text>
<rect x="380" y="440" width="96" height="34" rx="4" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/>
<text x="428" y="462" font-size="11" text-anchor="middle">Batch 0</text>
<rect x="480" y="440" width="96" height="34" rx="4" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/>
<text x="528" y="462" font-size="11" text-anchor="middle">Batch 1</text>
<rect x="580" y="440" width="96" height="34" rx="4" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/>
<text x="628" y="462" font-size="11" text-anchor="middle">Batch 2</text>
<rect x="680" y="440" width="96" height="34" rx="4" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"/>
<text x="728" y="462" font-size="11" text-anchor="middle">Batch 3</text>
<text x="180" y="501" font-size="12" text-anchor="start" style="fill:#94a3b8">Time →   fill pipeline  ·  steady state  ·  drain pipeline</text>
<text x="40" y="553" font-size="15" text-anchor="start">Serial batch time ≈ upload + compute + download</text>
<text x="40" y="582" font-size="15" text-anchor="start">Ideal pipelined interval ≈ max(upload, compute, download)</text>
<text x="40" y="621" font-size="11" text-anchor="start" style="fill:#94a3b8">Actual overlap is limited by copy engines, memory bandwidth and CPU submission.</text>
<text x="40" y="644" font-size="11" text-anchor="start" style="fill:#94a3b8">CUDA events enforce dependencies. A slot is reused only after its download finishes.</text>
<text x="40" y="673" font-size="11" text-anchor="start" style="fill:#94a3b8">GPU-resident control removes transfers; pinned memory alone does not create overlap.</text>
</svg>
