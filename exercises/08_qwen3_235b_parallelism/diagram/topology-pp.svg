<text x="35" y="692" font-size="15" fill="#e2e8f0" text-anchor="start" font-weight="400">Stage 0 precedes stage 1 for each forward pass; weights do not move at the stage boundary.</text>
<text x="35" y="718" font-size="15" fill="#e2e8f0" text-anchor="start" font-weight="400">47 / 47 is the vLLM default partition for 94 layers; this figure does not imply measured overlap.</text>
<text x="35" y="759" font-size="13" fill="#a8b7cb" text-anchor="start" font-weight="400">Cyan = GPU 0 ownership    Violet = GPU 1 ownership    Orange = logical cross-rank dependency</text>
<text x="35" y="787" font-size="13" fill="#a8b7cb" text-anchor="start" font-weight="400">Expert tiles are illustrative. AWQ packing/scales, embeddings, LM head and norms are omitted.</text>
<text x="35" y="813" font-size="13" fill="#a8b7cb" text-anchor="start" font-weight="400">Logical layout derived from the tested config + vLLM 0.24 source; not a memory dump or kernel trace.</text>
